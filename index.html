    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <script>
      (function () {
        try {
          var q = new URLSearchParams(location.search);
          if (q.get('phoneCanvas') === '0') return;
          var coarse = window.matchMedia('(pointer: coarse)').matches;
          if (!coarse && q.get('phoneCanvas') !== '1') return;
          var sw = window.screen.width;
          var sh = window.screen.height;
          var shortEdge = Math.min(sw, sh);
          // スマホは通常 viewport。iPad 等の 390px 拡大は React（useTabletPhoneCanvas）に任せる
          if (shortEdge < 744) return;
          if (q.get('phoneCanvas') !== '1') return;
          var w = window.innerWidth > 410 ? window.innerWidth : sw;
          var s = Math.min(Math.max(w / 390, 1), 3);
          var meta = document.querySelector('meta[name="viewport"]');
          if (!meta) return;
          meta.setAttribute(
            'content',
            'width=390, initial-scale=' +
              s +
              ', maximum-scale=' +
              s +
              ', user-scalable=no, viewport-fit=cover',
          );
          document.documentElement.dataset.rakudaPhoneCanvas = '1';
        } catch (e) {}
      })();
    </script>
